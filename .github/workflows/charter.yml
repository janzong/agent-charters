name: charter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']   # 声明的是 >=3.10，测两端
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --disable-pip-version-check --quiet -e . pytest
      - name: Run the test suite
        run: python -m pytest -q

  self-check:
    name: this repo's own AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 自己用自己的 action —— 消费方路径（`uses: janzong/agent-charters@v1`）走的就是这条链路，
      # 所以 CI 每秒都在替外部使用者踩一遍坑（安装、语料库是否打进包、GITHUB_ACTION_PATH 解析）。
      - uses: ./
        with:
          path: AGENTS.md
          # 这里**故意不**开 fail-on-dangling：本文件在概述里列了 `CLAUDE.md`、
          # `.cursorrules` 这些"语料库覆盖哪些文件类型"的名字，也提到 gitignore 的
          # data/raw、`.env`——它们是**提到**不是**指向**，而 refs 现在分不清这两者
          # （本地实测：开 true 会让这个 job 红，报 `AGENTS.md: CLAUDE.md` 找不到）。
          # 闸门要开也由使用者在自己的 workflow 里明确开（STATE.md D34）。
