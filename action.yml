# agent-charters —— GitHub Action（复合动作，无 Docker，装了就能跑）
#
# 用途：把一份 `AGENTS.md` 与 558 份语料库的基线比一次 —— 九类里写了哪几类、
# 指出去的路径还在不在。**不改你的文件**，只报告（除非你开 fail-on-*）。
#
# 用法（消费方仓库的 workflow）：
#   - uses: actions/checkout@v5
#   - uses: janzong/agent-charters@v1
#     with:
#       path: AGENTS.md
#       fail-on-missing: 'workflow,gotchas'   # 可选：缺了就让 job 红
#
# 为什么值得放进 CI：章程的失效方式不是"写错"，是**悄悄过期** ——
# 重命名了目录、删了脚本、换了命令，章程还指着老路径，而 agent 会照着不存在的
# 文件找。覆盖率同理：新加一类内容时，最容易漏的永远是没人提醒你的那一格。
name: agent-charters
description: >-
  Compare an AGENTS.md against the 558-file corpus baseline (which of the nine
  categories it covers, and what is missing), and check that every path it
  points at still exists.
author: janzong

branding:
  icon: clipboard
  color: blue

inputs:
  path:
    description: 'Charter file(s) to check, space-separated'
    required: false
    default: AGENTS.md
  lang:
    description: 'Output language: en or zh'
    required: false
    default: en
  fail-on-missing:
    description: >-
      Comma-separated categories that must be present, e.g. "workflow,gotchas".
      Valid names: overview,structure,build_test,style,workflow,environment,
      boundaries,gotchas,agent_meta. Empty (the default) = report only, never fail.
    required: false
    default: ''
  fail-on-dangling:
    description: >-
      Fail when the charter points at a path that does not exist. Off by default:
      a path inside a prohibition list ("never commit .env") is not a broken
      pointer, and the scanner cannot tell those two apart yet.
    required: false
    default: 'false'
  python-version:
    description: 'Python version used to run the tool'
    required: false
    default: '3.11'

outputs:
  missing:
    description: 'Categories absent from the charter(s), comma-separated'
    value: ${{ steps.check.outputs.missing }}
  dangling:
    description: 'Number of pointed-at paths that do not exist'
    value: ${{ steps.check.outputs.dangling }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agent-charters (the corpus ships inside this action)
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH"

    - name: Coverage and references
      shell: bash
      env:
        CHARTER_FILES: ${{ inputs.path }}
        CHARTER_LANG: ${{ inputs.lang }}
      run: |
        set -uo pipefail
        {
          echo "## agent-charters"
          echo
          echo "### Categories vs the corpus baseline"
          echo
          echo '```text'
          agent-charters compare $CHARTER_FILES --lang "$CHARTER_LANG" || true
          echo '```'
          echo
          echo "### External references"
          echo
          echo '```text'
          agent-charters refs $CHARTER_FILES --lang "$CHARTER_LANG" || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        agent-charters compare $CHARTER_FILES --lang "$CHARTER_LANG" || true
        agent-charters refs $CHARTER_FILES --lang "$CHARTER_LANG" || true

    - name: Enforce the configured policy
      id: check
      shell: bash
      env:
        CHARTER_FILES: ${{ inputs.path }}
        CHARTER_LANG: ${{ inputs.lang }}
        FAIL_ON_MISSING: ${{ inputs.fail-on-missing }}
        FAIL_ON_DANGLING: ${{ inputs.fail-on-dangling }}
      run: python -m agent_charters.gha
