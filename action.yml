# agent-charters —— GitHub Action（复合动作，无 Docker，装了就能跑）
#
# 用途：把一份 `AGENTS.md` 与 558 份语料库的基线比一次 —— 九类里写了哪几类、
# 指出去的 **Markdown 指针**还在不在（`.sh` / `.py` / `.env` 这类裸文件名不在扫描范围内）。
# **不改你的文件**，只报告（除非你开 fail-on-*）。
#
# 一条实测得出的行为（2026-09-15）：`path` 指到的那份文件如果**本身就是指针**
# （`CLAUDE.md` 全文 `@AGENTS.md`、或一句 "Read CLAUDE.md before repository work."），
# 工具会**跟过去判目标文件**并在摘要里说明——根级章程里 111/791 是符号链接、75 份是这种
# 纯指针（中位 11 字节），不跟随就会对它们报"缺 9 个类别"，那是假警报。
#
# 用法（消费方仓库的 workflow）：
#   - uses: actions/checkout@v5
#   - uses: janzong/agent-charters@v1
#     with:
#       path: AGENTS.md
#       fail-on-missing: 'workflow,gotchas'   # 可选：缺了就让 job 红
#
# 为什么值得放进 CI：章程的失效方式不是"写错"，是**悄悄过期** ——
# 重命名了目录、删了脚本、换了命令，章程还指着老路径，而 agent 会照着不存在的
# 文件找。覆盖率同理：新加一类内容时，最容易漏的永远是没人提醒你的那一格。
name: agent-charters
description: >-
  Compare an AGENTS.md against the 558-file corpus baseline (which of the nine
  categories it covers, and what is missing), and check that its markdown
  pointers (links, backticked .md/.txt paths, directory references) still exist.
  Bare filenames such as .env or build.sh are not scanned.
author: janzong

branding:
  icon: clipboard
  color: blue

inputs:
  path:
    description: 'Charter file(s) to check, space-separated'
    required: false
    default: AGENTS.md
  lang:
    description: 'Output language: en or zh'
    required: false
    default: en
  fail-on-missing:
    description: >-
      Comma-separated categories that must be present, e.g. "workflow,gotchas".
      Valid names: overview,structure,build_test,style,workflow,environment,
      boundaries,gotchas,agent_meta. Empty (the default) = report only, never fail.
    required: false
    default: ''
  fail-on-dangling:
    description: >-
      Fail when a markdown pointer in the charter does not exist. Off by default:
      a directory inside a prohibition list ("never commit dist/") is not a
      broken pointer, and the scanner cannot tell those two apart yet.
    required: false
    default: 'false'
  python-version:
    description: 'Python version used to run the tool'
    required: false
    default: '3.11'

outputs:
  missing:
    description: 'Categories absent from the charter(s), comma-separated'
    value: ${{ steps.check.outputs.missing }}
  dangling:
    description: 'Number of pointed-at paths that do not exist'
    value: ${{ steps.check.outputs.dangling }}
  followed:
    description: >-
      Number of charter files that were themselves pointers (`@AGENTS.md`, "read
      CLAUDE.md") and were judged by their target instead. Followed files are listed
      in the job summary; ones whose target is not next to them are reported there
      but never fail the build.
    value: ${{ steps.check.outputs.followed }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agent-charters (the corpus ships inside this action)
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH"

    - name: Coverage and references
      shell: bash
      env:
        CHARTER_FILES: ${{ inputs.path }}
        CHARTER_LANG: ${{ inputs.lang }}
      run: |
        set -uo pipefail
        {
          echo "## agent-charters"
          echo
          echo "### Categories vs the corpus baseline"
          echo
          echo '```text'
          agent-charters compare $CHARTER_FILES --lang "$CHARTER_LANG" || true
          echo '```'
          echo
          echo "### External references"
          echo
          echo '```text'
          agent-charters refs $CHARTER_FILES --lang "$CHARTER_LANG" || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        agent-charters compare $CHARTER_FILES --lang "$CHARTER_LANG" || true
        agent-charters refs $CHARTER_FILES --lang "$CHARTER_LANG" || true

    - name: Enforce the configured policy
      id: check
      shell: bash
      env:
        CHARTER_FILES: ${{ inputs.path }}
        CHARTER_LANG: ${{ inputs.lang }}
        FAIL_ON_MISSING: ${{ inputs.fail-on-missing }}
        FAIL_ON_DANGLING: ${{ inputs.fail-on-dangling }}
      run: python -m agent_charters.gha
