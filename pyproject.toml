[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-charters"
version = "0.4.1"
description = "Structured corpus of AGENTS.md — the written rules humans hand to AI agents ｜ 人写给 AI 智能体的书面规约的结构化语料库"
readme = "README.en.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "janzong", email = "287099612+janzong@users.noreply.github.com" }]
keywords = ["agents", "agents-md", "agent-instructions", "corpus", "dataset", "llm", "prompt-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Documentation",
]
# 运行时零依赖（0.4.0）：语料库随包以 .jsonl.gz 分发，只用到标准库的
# gzip + json。此前为了读一张 550 KB 的表而拖 pandas + pyarrow ≈62 MB，
# 国内直连 PyPI 下常断流——"看到→用上"的坎恰好卡在这里。
dependencies = []

[project.optional-dependencies]
# 只有读/写 parquet（发布格式）才需要它，日常使用不装
parquet = ["pandas>=2.0", "pyarrow>=14"]
# 跑测试需要：数据集重放/确定性校验都走 parquet
test = ["pytest", "pyyaml", "pandas>=2.0", "pyarrow>=14",
        "tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/janzong/agent-charters"
Repository = "https://github.com/janzong/agent-charters"
Issues = "https://github.com/janzong/agent-charters/issues"
Mirror = "https://gitee.com/janzong/agent-charters"

[project.scripts]
agent-charters = "agent_charters.cli:main"

[tool.setuptools]
packages = ["agent_charters"]

[tool.setuptools.package-data]
# 随包的是 jsonl.gz（标准库可读）；parquet 只作为发布格式留在 data/processed
agent_charters = ["data/*.jsonl.gz"]
