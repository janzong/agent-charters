[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-charters"
version = "0.2.0"
description = "人写给 AI 智能体的书面规约（AGENTS.md）的结构化语料库"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.scripts]
agent-charters = "agent_charters.cli:main"

[tool.setuptools]
packages = ["agent_charters"]

[tool.setuptools.package-data]
agent_charters = ["data/*.parquet"]
